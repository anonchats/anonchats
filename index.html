<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ChatAnon</title>
<style>
:root{--bg:#f3f1f8;--card:#fff;--fg:#1b1930;--mut:#7a7894;--bd:#e2dff0;--ac:#5b3fd9;--acT:#fff;--in:#ece9f7}
@media(prefers-color-scheme:dark){:root{--bg:#100f1a;--card:#1a1829;--fg:#ece9ff;--mut:#9a97b8;--bd:#2a2742;--ac:#8b73ff;--acT:#120d33;--in:#262338}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top,0)}
.hidden{display:none!important}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#auth{min-height:100%;display:grid;place-items:center;padding:20px}
.box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:26px}
h1{margin:0 0 4px;font-size:28px;letter-spacing:-.02em}
.sub{margin:0 0 20px;color:var(--mut)}
.tabs{display:flex;gap:4px;background:var(--in);padding:4px;border-radius:12px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:9px;cursor:pointer;color:var(--mut)}
.tabs button.on{background:var(--card);color:var(--fg);font-weight:600}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
input{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
.go{width:100%;margin-top:18px;padding:12px;border:0;border-radius:12px;background:var(--ac);color:var(--acT);font-weight:600;cursor:pointer}
.go:disabled{opacity:.6}
#msg{min-height:20px;margin:12px 0 0;font-size:14px;color:#d6336c}
#msg.ok{color:#2b9348}
#chat{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--bd)}
header b{font-size:18px}
header span{flex:1;color:var(--mut);font-size:14px}
header button{border:1px solid var(--bd);background:none;border-radius:10px;padding:6px 12px;cursor:pointer}
#list{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.empty{margin:auto;color:var(--mut);text-align:center}
.row{display:flex;gap:8px;max-width:85%}
.row.me{align-self:flex-end;flex-direction:row-reverse}
.av{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
.bub{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:8px 12px;min-width:0}
.me .bub{background:var(--ac);color:var(--acT);border-color:var(--ac)}
.nm{font-size:13px;font-weight:600;margin-bottom:2px}
.tx{white-space:pre-wrap;overflow-wrap:anywhere}
.tm{font-size:11px;opacity:.65;margin-top:2px;text-align:right}
form{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0));border-top:1px solid var(--bd)}
form input{flex:1;border-radius:22px;padding:11px 16px}
form button{border:0;border-radius:22px;padding:0 20px;background:var(--ac);color:var(--acT);font-weight:600;cursor:pointer}
</style>
</head>
<body>
<section id="auth">
  <div class="box">
    <h1>ChatAnon</h1>
    <p class="sub">Ngobrol bareng pakai nama samaran. Username kamu tidak pernah terlihat orang lain.</p>
    <div class="tabs"><button id="tLogin" class="on" type="button">Masuk</button><button id="tReg" type="button">Daftar</button></div>
    <label for="u">Username</label><input id="u" autocomplete="username" autocapitalize="none">
    <div id="nickW" class="hidden"><label for="nick">Nama samaran</label><input id="nick" maxlength="20"></div>
    <label for="p">Password</label><input id="p" type="password" autocomplete="current-password">
    <div id="cfW" class="hidden"><label for="cf">Ulangi password</label><input id="cf" type="password" autocomplete="new-password"></div>
    <button class="go" id="go" type="button">Masuk</button>
    <p id="msg" role="status"></p>
  </div>
</section>

<section id="chat" class="hidden">
  <header><b>ChatAnon</b><span id="who"></span><button id="out" type="button">Keluar</button></header>
  <div id="list"><p class="empty">Belum ada pesan. Kirim yang pertama.</p></div>
  <form id="f"><input id="t" maxlength="500" placeholder="Tulis pesan" autocomplete="off"><button>Kirim</button></form>
</section>

<script>
// Isi dengan alamat backend Render kamu (tanpa garis miring di akhir)
const API = "https://GANTI-DENGAN-URL-RENDER.onrender.com";

const $ = (id) => document.getElementById(id);
let mode = "login", token = "", me = "", nick = "", last = 0, timer = null;
try { token = localStorage.getItem("ca_token") || ""; me = localStorage.getItem("ca_me") || ""; nick = localStorage.getItem("ca_nick") || ""; } catch (_) {}

async function api(path, body) {
  const r = await fetch(API + path, {
    method: body ? "POST" : "GET",
    headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}) },
    body: body ? JSON.stringify(body) : undefined
  });
  const j = await r.json().catch(() => ({ ok: false, error: "Server tidak merespons." }));
  if (r.status === 401 && token) logout();
  return j;
}

function say(t, ok) { const m = $("msg"); m.textContent = t || ""; m.className = ok ? "ok" : ""; }

function setMode(m) {
  mode = m;
  $("tLogin").classList.toggle("on", m === "login");
  $("tReg").classList.toggle("on", m === "reg");
  $("nickW").classList.toggle("hidden", m === "login");
  $("cfW").classList.toggle("hidden", m === "login");
  $("go").textContent = m === "login" ? "Masuk" : "Buat akun";
  $("p").autocomplete = m === "login" ? "current-password" : "new-password";
  say("");
}
$("tLogin").onclick = () => setMode("login");
$("tReg").onclick = () => setMode("reg");

async function submit() {
  const go = $("go"); go.disabled = true; say("");
  const body = { username: $("u").value, password: $("p").value };
  if (mode === "reg") { body.nick = $("nick").value; body.confirm = $("cf").value; }
  const j = await api(mode === "login" ? "/api/login" : "/api/register", body);
  go.disabled = false;
  if (!j.ok) return say(j.error || "Gagal.");
  if (mode === "reg") { setMode("login"); $("p").value = ""; return say(j.message, true); }
  token = j.token; me = j.me; nick = j.nick;
  try { localStorage.setItem("ca_token", token); localStorage.setItem("ca_me", me); localStorage.setItem("ca_nick", nick); } catch (_) {}
  openChat();
}
$("go").onclick = submit;
["u", "p", "cf", "nick"].forEach((id) => $(id).addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); }));

function logout() {
  token = me = nick = ""; last = 0; clearInterval(timer);
  try { localStorage.removeItem("ca_token"); localStorage.removeItem("ca_me"); localStorage.removeItem("ca_nick"); } catch (_) {}
  $("chat").classList.add("hidden"); $("auth").classList.remove("hidden");
  $("list").innerHTML = '<p class="empty">Belum ada pesan. Kirim yang pertama.</p>';
}
$("out").onclick = logout;

function color(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return `hsl(${h} 55% 45%)`; }

function bubble(m) {
  const row = document.createElement("div"); row.className = "row" + (m.p === me ? " me" : "");
  const av = document.createElement("div"); av.className = "av"; av.style.background = color(m.p); av.textContent = (m.nick[0] || "?").toUpperCase();
  const b = document.createElement("div"); b.className = "bub";
  const n = document.createElement("div"); n.className = "nm"; n.textContent = m.p === me ? "Kamu" : m.nick;
  const t = document.createElement("div"); t.className = "tx"; t.textContent = m.text;
  const tm = document.createElement("div"); tm.className = "tm"; tm.textContent = new Date(m.t * 1000).toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
  b.append(n, t, tm); row.append(av, b);
  return row;
}

function add(msgs) {
  if (!msgs.length) return;
  const list = $("list"), near = list.scrollHeight - list.scrollTop - list.clientHeight < 80;
  if (!last) list.innerHTML = "";
  msgs.forEach((m) => { if (m.id > last) { list.append(bubble(m)); last = m.id; } });
  if (near || msgs.some((m) => m.p === me)) list.scrollTop = list.scrollHeight;
}

async function poll() {
  const j = await api("/api/messages?after=" + last);
  if (j.ok) add(j.messages);
}

function openChat() {
  $("auth").classList.add("hidden"); $("chat").classList.remove("hidden");
  $("who").textContent = "Sebagai " + nick;
  last = 0; poll(); clearInterval(timer); timer = setInterval(() => { if (!document.hidden) poll(); }, 3000);
}

$("f").onsubmit = async (e) => {
  e.preventDefault();
  const el = $("t"), text = el.value.trim();
  if (!text) return;
  el.value = "";
  const j = await api("/api/send", { text });
  if (j.ok) add([j.message]); else { el.value = text; alert(j.error || "Gagal mengirim."); }
};

if (token) openChat();
</script>
</body>
</html>
